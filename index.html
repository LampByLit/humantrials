<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Human Trials</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="pour"></div>
    <div id="health"></div>
    <div id="hud">
      Look down at the bench to reach, scroll to reach further. Hold left click on a
      beaker to pick it up. Hold Space and move the mouse to tip it and pour. Hold Shift
      to walk and tip slowly. Double-click to lock or unlock the grip. Look all the way
      up and pour onto yourself to drink.
    </div>
    <div id="prompt">Click to begin</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
